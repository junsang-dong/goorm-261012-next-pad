[package]
name = "nextpad"
version = "0.1.0"
description = "NextPad - a lightweight text editor"
authors = ["NextPad"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "nextpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

# Starting point per SPEC §15; re-verify functional tests still pass after any size tuning.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
